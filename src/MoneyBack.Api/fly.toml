app = "moneyback-api"
primary_region = "iad"

[build]

[env]
  Jwt__Issuer = "MoneyBack.Api"
  Jwt__Audience = "MoneyBack.Clientes"
  Jwt__AccessTokenMinutos = "15"
  # La sesión dura 90 días y se renueva sola en cada uso, así que quien
  # abre la app cada semana no vuelve a escribir la contraseña nunca.
  Jwt__RefreshTokenDias = "90"
  Subsidios__SmmlvVigente = "1750905"
  Cors__AllowedOrigins__0 = "https://moneyback-app.web.app"
  Cors__AllowedOrigins__1 = "https://moneyback-app.firebaseapp.com"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  # 256mb le quedaba corto a .NET con EF Core: el recolector de basura
  # trabaja al límite y una consulta pesada puede tumbar la máquina sin
  # dejar rastro en los logs. Subir a 512mb cuesta centavos y quita de la
  # mesa toda una familia de caídas imposibles de diagnosticar.
  memory = "512mb"

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "15s"
  method = "GET"
  path = "/health"
