<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover es lo que activa env(safe-area-inset-*) en CSS.
         Sin esto esas variables valen 0 y la app queda encajonada entre
         barras en vez de ir de borde a borde como una app nativa. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MoneyBack</title>
    <base href="/" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="theme-color" content="#2f6f5e" />
    <!-- Necesarios para que iOS trate la PWA como app instalada (display:
         standalone) al agregarla a la pantalla de inicio — sin esto, Safari
         la sigue tratando como una pestaña normal y no entrega push. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "default" junto con viewport-fit=cover, que es la combinación que sirve
         en una app con tema claro y oscuro: el contenido llega hasta el borde,
         así que el fondo lo pinta la app (siempre acorde al tema), y iOS elige
         el color de la hora según la apariencia del sistema.
         black-translucent no sirve acá: fuerza la hora a blanco siempre, lo que
         obliga a una franja oscura que en modo claro se ve como una banda gris.
         La franja blanca que aparecía antes era de instalaciones previas a
         viewport-fit=cover, donde iOS reservaba el espacio y lo rellenaba él. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MoneyBack" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <!-- If you add any scoped CSS files, uncomment the following to load them
    <link href="MoneyBack.Web.styles.css" rel="stylesheet" /> -->
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <!-- Antes el service worker solo se registraba al activar notificaciones
         (ver interop.js): quien nunca las activaba se quedaba sin caché y sin
         poder abrir la app sin señal. Se registra después de 'load' para no
         competir con la descarga inicial de Blazor. -->
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("/service-worker.js")
                    .catch((error) => console.error("No se pudo registrar el service worker:", error));
            });
        }
    </script>
</body>

</html>
